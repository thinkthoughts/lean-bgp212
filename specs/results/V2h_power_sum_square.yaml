    - "Cauchy–Schwarz on the block {1, P₂} with V2f's J_T[1, 1] and V2g's J_T[P₂, 1]: J[P₂,1]² / (J[1,1] J[P₂,P₂]) = 0.98321 (1 − ratio = 0.01679) < 1"
  observation_exploratory: >
    The ratio 0.98321 means that P₂ is nearly parallel to 1 in the J_T inner product on T̂ at
    Table 3: the 2 × 2 Gram block is close to singular. If this persists across B₂₁, the J_T Gram
    matrix is badly conditioned, which reinforces exact arithmetic for J_T(P⋆) − 4 I_T(P⋆).
