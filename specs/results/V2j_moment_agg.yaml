# Result record: twenty-second Challenge/Solution pair (V2j, shared-moment aggregation of marginal Gram entries)

identity:
  id: V2j
  statement: "V2i's piece value genPieceWith is linear in the moment oracle and reads it only at genKeys; for any duplicate-free key list S covering the queried keys it equals Σ_{s ∈ S} genPieceWith (delta s) · Mo s. For a weighted list ws of generator pairs, aggEntryVal N g L τ C ws (coefficients collected per key across all pairs, each distinct moment evaluated once per piece) equals Σ_{(w, a₁, l₁, a₂, l₂) ∈ ws} w · genEntryVal N g L τ C a₁ l₁ a₂ l₂, hence Σ w · J_T[G_{a₁,l₁}, G_{a₂,l₂}]"
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.4, the display of J_T (p. 41), §11 (B₂₁, p. 42)"
  builds_on: "V2i (genPieceWith, genEntryVal, stateVal, placeVal, coordSum, innerTerms, pieceMn, genEntry_eq, placeVal_zero, gpPP_6_3); V2f–V2h cell definitions; A0–V2i unchanged"
  base_commits: "V2i snapshot 841dd05 (V2i patch applied to c22e4dc); V2i's VPS verification is reported separately and is not assumed here"

