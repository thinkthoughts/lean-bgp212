# Result record: twenty-sixth Challenge/Solution pair (V2n, direct certified moment-profile transitions)

identity:
  id: V2n
  statement: "The moment profile alone does not determine the child's profile under a shifted power sum P̂_q (profile_insufficient, classProfile_insufficient: Lean-checked counterexamples at Table 3, piece (6, 3)). The marked profile of order ≤ T (entries ((A, B, u), κ ∏ e!) for ordered tuples u of distinct parts) is sufficient: one factor maps the marked profile of order ≤ T + 1 of a combination to the marked profile of order ≤ T of its child, entry by entry, without forming the child's states (markProfile_step, for arbitrary class sizes, factors, orders and test functions). Certificates (MarkOK) start from V2m's certified states or trie nodes (markOK_of_chain, markOK_of_chunks, markOK_of_tree, markOK_of_trie), follow direct transitions (markOK_step, markOK_step_chunks, markOK_step_tree), regroup (markOK_congr, markOK_mono) and give V2m's ProfCert (profCert_of_markOK, profCert_of_markStep); V2n's profiles join V2m's ProfOK list (profOK_append) for trieProf_table_eq."
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.4, the display of J_T (p. 41), §11 (B₂₁, p. 42)"
  builds_on: "V2m (TrieOK, ProfOK, stepFactor, Tt_prof, Tt_prof_ok, the certified states Tt_L_* and chains Tt_c_*, trieProf_table_eq, table_parts_merge, blockMultisets, natListMem, trieShapeOK); V2ℓ (ChainCert, ProfCert, abProfile, profTable, mergeAll); V2k (symStep, keyA, keyB, factW, picks, clsCnt); A0–V2m unchanged"
  base_commits: "V2m 3e6ae72 on the V2j branch; the same Lean and Comparator content as V2m a6f3220 on v2m-main. V2m's independent verification is reported separately and is not assumed here"

