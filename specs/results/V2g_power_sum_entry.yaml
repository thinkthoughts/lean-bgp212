    - "Monte Carlo at N = 44, Table 3 (uniform samples of the τ-simplex, true rough-set endpoint, untranslated P̂₂): 4.99748e-57 ± 6.85e-60 (200 000 samples, z = −0.29) and 5.00210e-57 ± 9.76e-60 (100 000 samples in the controls, z = 0.27)"
