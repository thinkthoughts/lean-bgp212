    comparator_suite: "about 2 387 seconds (40 min) in the build container, peak 3.17 GB (it replays the certificate)"
    cost_relative_to_V2f: "about 7× J_T[1, 1] (2 286 s against 324 s)"
    full_gram_cost_model: >
      Every J_T entry is a combination of per-piece moments cellsVal(α + A, β + B, m, n) with
      A + B ≤ 40, A + B + m + n ≤ 44 (up to 163 016 per piece, 2.2 × 10⁷ over 133 pieces):
      250–600 kernel-days entry by entry. Collapsing the weighted integrand of J_T(P⋆) per cell
      to one bivariate polynomial (≤ 1 035 monomials, 5 cells per piece) needs about 6.9 × 10⁵
      boxVal evaluations at 0.4–0.9 s each: about 4–7 kernel-days single-threaded, parallel
      across pieces (Exploratory/V2e/ROADMAP.md §7).
    development_builds: "only the V2g modules and their dependencies; the 19-suite regression is left to the VPS"
