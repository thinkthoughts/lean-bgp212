  observation_exploratory: >
    At Table 3 the shift terms of P̂₂(y + g·1_{R∪K}) contribute +35.8% (R) and −35.8% (K) of the
    entry; their sum is −1.7 × 10⁻¹² of it. The inclusion–exclusion thus carries cancellation to
    about twelve digits (exact arithmetic is essential); whether an exact identity underlies the
    near-cancellation is open.
