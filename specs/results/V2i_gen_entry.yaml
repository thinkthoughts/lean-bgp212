  definitions: [BGP212/GenEntry.lean, BGP212/GenEntryBlock.lean]
  challenge: Challenge/GenEntry.lean
  solution: [Solution/GenEntry.lean, Solution/GenEntryTable.lean, Solution/GenEntryCert0.lean … Solution/GenEntryCert13.lean, Solution/GenEntryCertSum.lean]
