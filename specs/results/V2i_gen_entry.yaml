  computational_certificate: >
    Solution/GenEntryCert0.lean … GenEntryCert13.lean (one per row, each importing V2h's row file)
    and Solution/GenEntryCertSum.lean, generated by specs/checks/gen_entry_v2i_emit.py: per nonempty
    piece two new moments pieceMn … 2 1 and pieceMn … 3 0 by decide +kernel, and four piece values
    genPiece (PP, P4, P22, LP) by decide +kernel against tableFn of certified moments (V2h's mom,
    e4, u6 through the bridges; no cell is re-evaluated); 798 piece lemmas; rows and totals by
    decide +kernel on numerals.
  unproved_assumptions: "none (axioms: propext, Quot.sound, Classical.choice)"
  remaining_computational_obligations: >
    Evaluating further entries needs their moment tables: the keys (A, B, m, n) queried by
