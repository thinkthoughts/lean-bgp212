# Result record: twenty-first Challenge/Solution pair (V2i, general marginal Gram entries J_T[G_{a,λ}, G_{b,μ}])

identity:
  id: V2i
  statement: "For every N ≥ 1, data with 0 ≤ g ≤ C(1), C(N) < N g, and all (a₁, λ₁), (a₂, λ₂) (parts of λ as lists), J_T[G_{a₁,λ₁}, G_{a₂,λ₂}] = (N+1) ∫_{T̂} (∫₀^U G_{a₁,λ₁})(∫₀^U G_{a₂,λ₂}) = genEntryVal N g L τ C a₁ λ₁ a₂ λ₂, where G_{a,λ} = (L − P₁)^a P_λ; at Table 3 every entry of B₂₁ is an explicit rational (jT_gen_table3), with four entries evaluated by the kernel"
  source: "Source/bgp212.pdf: Definition 4.6 (p. 6), Table 3 (p. 39), §9.4, Lemma 9.2 and the display of J_T (p. 41), Proposition 10.2 (pp. 41–42), §11 (B₂₁, p. 42)"
  builds_on: "V2h (classes cls, clsCount, clsShift, roughPart, smoothPart, agg_mem_facts, agg_compl_facts, shift_cls, sum_cls, the certified moments mom/e4/u6), V2g (jTbil, strat_integral, pieceE, pw, prod_pw, cond_tail, cond_high), V2f (cellsVal, seg0Val, pieceJ, piece_block, count_by_card, table3_hyps, casts), V2e-A (piece_r0_w, aggregates, stratumEndpoint_shift), V2d (endpoint, hatSupport_eq), V2c (eval_gen), V2b (pieceSet, shiftV, integrableOn_pieceSet), V0 (gen); A0–V2h unchanged"
  base_commits: "proof 6cef1f4, provenance a9b0e0c; patch against c22e4dc (paper-only changes after a9b0e0c)"

state:
  mathematical: proved
  computational: kernel-verified
  provenance: pinned
  publication: draft

scope:
  proved_general: >
    piece_mono_n (any monomial weight against U^m (L − S)^n on a piece is (∏ tᵢ!) · pieceMn at the
    rough and smooth degrees), lpEval_add, lpEval_mul, lpEval_shiftPow (coefficient-list
    polynomials), coord_integral (one open coordinate), piece_state (any number of open coordinates
    with polynomial weights), piece_place (products of class-dependent power sums: each factor
    merges into an open coordinate or opens one of class c with multiplicity n_c − #open; the
    induction replaces the explicit set-partition / falling-factorial count), psum_shift, piece_psum
    (power-sum products P̂_Q(y + g·1_{R∪K})), prod_subsetTerms, inner_mono, inner_genFun (the inner
    integral of a generator), genEntry_eq (the entry in closed form), tableFn_eq (moment tables),
    pieceMn_zero, pieceMn_zero_zero, pieceE_eq_pieceMn, pieceMn_of_pieceE (bridges to V2f–V2h's
    certified moments), genPiece_empty, pieceMn_cast, genPiece_cast, genEntryVal_cast,
    eval_gen_list.
  table3_general: "jT_gen_table3: for all (a₁, λ₁), (a₂, λ₂), J_T[gen a₁ λ₁, gen a₂ λ₂] at Table 3 equals the rational genEntryVal 44 g L τ C a₁ λ₁ a₂ λ₂ (an exact representation of every B₂₁ entry; evaluating it is a computation, not done here except for the entries below)"
