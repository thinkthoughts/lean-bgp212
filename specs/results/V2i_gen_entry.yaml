  grid_check: specs/checks/gen_entry_v2i_grid.py
  roadmap: Exploratory/V2e/ROADMAP.md
  independent_checks:
    - "the exact model at synthetic N = 3 (g = 3/10, L = 1, τ = 9/10, C = 0, 1/2, 3/5, 7/10) reproduces V2f's J[1,1] = 0.03768, V2g's J[P₂,1] = 0.0069236 and V2h's J[P₂,P₂] = 0.00136761 exactly (as rationals)"
    - "synthetic N = 3, direct midpoint grids (specs/checks/gen_entry_v2i_grid.py; true rough-set endpoint, untranslated generators, Gauss–Legendre inner integrals) against the exact model, grids 100³ / 200³ / 400³: J[P₄,1] 0.000775279 vs +0.28% / +0.45% / −0.52%; J[P_(2,2),1] 0.00149082 vs −0.33% / +0.61% / −0.53%; J[L−P₁,1] 0.0110828 vs −0.35% / +0.27% / −0.19%; and, beyond the certified entries (three factors, a = 1, 2), J[P_(2,2),P₂] 0.000308093 vs +0.07% / +0.63% / −0.65%, J[(L−P₁)P₂,(L−P₁)P₂] 7.04548e-05 vs −0.06% / +0.24% / −0.25%, J[(L−P₁)²P₄,P₂] 8.16768e-06 vs +0.68% / +0.22% / −0.41% (the oscillating sub-percent errors of a midpoint grid across the endpoint's kinks, as in V2h)"
    - "Monte Carlo at N = 44, Table 3 (uniform samples of the τ-simplex, true rough-set endpoint, untranslated generators; 2 000 000 samples, numpy): J[P₄,1] 2.75301e-59 ± 2.5e-62 (z = 0.52), J[P_(2,2),1] 2.28842e-58 ± 1.1e-61 (z = 0.38), J[L − P₁,1] 5.53266e-57 ± 4.3e-60 (z = 1.06)"
    - "the generator reproduces the 15 certificate files byte-identically"
    - "exact identity: J[P_(2,2),1] − J[P₂,P₂] = (1/5 − 1/9) · 45 ∫_{T̂} U⁶ (both sides from the same certified moments)"
  observation_exploratory: >
    At Table 3, J[P₄, 1] with the shift removed differs from the certified value by about
    1.5 × 10⁻¹¹ relative: the R- and K-shift terms nearly cancel, as V2g found for J[P₂, 1]. For
    the block {1, L − P₁}, J[L−P₁,1]² / (J[1,1] J[L−P₁,L−P₁]) ≈ 0.914 (exact rationals from the
    model; J[L−P₁, L−P₁] itself is not kernel-certified here).
