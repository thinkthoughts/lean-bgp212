# Result record: twenty-third Challenge/Solution pair (V2k, symmetric-function reduction of the placement recursion)

identity:
  id: V2k
  statement: "V2k's symmetric-function evaluator symPlaceVal M n φs (states: products of augmented monomial symmetric functions ∏_c m̃_{ν_c}, stored as canonical partition-indexed lists with exact coefficients; factors applied by p_{c,a} · m̃_ν = Σ_j m̃_{ν+a e_j} + m̃_{ν∪(a)}; final states integrated as ∏ e! · M(A, B)) equals V2i's placement value placeVal M n 0 Fin.elim0 Fin.elim0 φs for every moment oracle M, class sizes n and factor list φs over every ordered field; hence genPieceSym = genPieceWith, genEntrySym = genEntryVal and J_T[G_{a₁,λ₁}, G_{a₂,λ₂}] = genEntrySym. The weighted run is the unweighted transition p_α = Σ_ν R_{α,ν} m̃_ν (R independent of n) times ∏_c (n_c)_{ℓ(ν_c)}, giving the Dirichlet-weighted moment formula ∫ p_α = Σ_ν R_{α,ν} · ∏_c (n_c)_{ℓ(ν_c)} ∏ νᵢ! · M(A, B); every moment coefficient of a piece comes from one evaluation (genTable, aggTable)."
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.4, the display of J_T (p. 41), §11 (B₂₁, p. 42)"
  builds_on: "V2i (placeVal, stateVal, coordSum, lpMul, lpShiftPow, innerTerms, genPieceWith, genEntryVal, genEntry_eq, gpPP_6_3); V2j (MKey, WPair, delta, aggCoeff, agg4_6_3_eq, genEntrySmall_PP, the certified moments mo_*); A0–V2j unchanged"
  base_commits: "V2j 8fa2aa5 (V2j patch applied to V2i snapshot 841dd05); the same Lean and Comparator content as the rebased V2j commit 4e02daf on main e20c364 (V2i proof commit a994d73, provenance 486cf85). V2j's VPS verification is reported separately and is not assumed here"

state:
  mathematical: proved
  computational: kernel-verified demonstration
  provenance: pinned
  publication: draft

scope:
  proved: >
    placeVal_eq_msum, placeVal_eq_msVal (V2i's placement recursion is the multiset-state value
    msVal); msVal_zero_part (m̃_{ν∪(0)} = (n_c − ℓ) m̃_ν); symStep_val, normalize_val, symRun_val (the
    canonical evaluator against msVal, step by step); symPlaceVal_eq, genPieceSym_eq, genEntrySym_eq,
    jT_eq_genEntrySym, aggCoeff_eq_sym (equivalence with V2i and V2j for every oracle);
    symRun_scale, symPlaceVal_eq_trans, placeVal_eq_trans (transition and Dirichlet-weighted moment
    formula); lpEval_psFactor, psTrans_indep, placeVal_psTrans (products of class power sums);
    genPieceWith_eq_table, aggTable_eq, genEntryVal_eq_table (all moment coefficients of a piece
    from one evaluation).
  demonstration: >
    Solution/SymReduceDemo1–3.lean (generated by specs/checks/sym_reduce_v2k_demo.py): transition
    tables trans_p2_p2, trans_p1_cubed, trans_mixed; V2i's placeVal and V2k's symPlaceVal each
    evaluated by the kernel at degrees 4 and 6 (equal); V2k by the kernel at degrees 8 and 10 with
    V2i's statement through symPlaceVal_eq; at Table 3, piece (6, 3): genTable of J_T[P₂, P₂]
    (19 keys) and the piece value (the same statement as V2i's gpPP_6_3, := rfl), aggTable of V2i's
    four entries (21 keys; the same statement as V2j's agg4_6_3_eq, := rfl), genTable of
    J_T[P_(2,2), P_(2,2)] (85 keys, one kernel evaluation) and the piece as an explicit combination
    of 85 moments; the synthetic N = 3 entry J_T[P₂, P₂] from ten piece tables (the same statement
    as V2j's genEntrySmall_PP, := rfl).
  unproved_assumptions: "none (axioms: propext, Quot.sound, Classical.choice)"
  outside_V2k: >
    The 85 Table 3 moments of J_T[P_(2,2), P_(2,2)] on piece (6, 3) beyond V2j's 21, the other pieces
    of that entry, the 846 × 846 matrices, P⋆ and J_T(P⋆) − 4 I_T(P⋆) (Exploratory/V2k/SPEC.md §7).

