# Result record: twenty-fifth Challenge/Solution pair (V2m, certified prefix-trie evaluation for B₂₁)

identity:
  id: V2m
  statement: "A certified prefix trie of factor multisets (TrieOK: every node (Q, L) carries a chain certificate from the empty state for the factors P̂_q, q ∈ Q, each node added from a parent in the trie by one certified step) evaluates V2i's placement value for every reordering of a node's degrees and every moment oracle: TrieOK n g T → (Q, L) ∈ T → Q'.Perm Q → placeVal M n 0 Fin.elim0 Fin.elim0 (psFactors g Q') = symFinal M L (trieOK_placeVal). Moment profiles of leaves are certified from their stored parents (profCert_of_step, profCert_of_step_chunks), are invariant under reordering (profCert_perm), and certified profile lists give Gram-entry coefficient tables (trieProf_table_eq, through V2ℓ's profTable_eq)."
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.4, the display of J_T (p. 41), §11 (B₂₁, p. 42)"
  builds_on: "V2ℓ (StepCert, ChainCert, chainCert_snoc, chainCert_append, chainCert_placeVal, placeVal_perm, abProfile, ProfCert, profCert_of_chain, profCert_of_chunks, profTable, profTable_eq, stepCert_runs, decComb/decTable/decProf, genPieceP222_6_3_staged_expansion); V2k (symStep, normalize, symFinal); V2i (placeVal, genPieceWith, subsetTerms); A0–V2ℓ unchanged"
  base_commits: "V2ℓ 5e8feaa on the V2j branch; the same Lean and Comparator content as V2ℓ a02c40e on main. V2ℓ's independent verification is reported separately and is not assumed here"

state:
  mathematical: proved
  computational: kernel-verified demonstration (77 of the 2 360 trie nodes of one piece)
  provenance: pinned
  publication: draft

scope:
  proved: >
    trieOK_nil, trieOK_root, trieOK_cons, trieOK_cons_chain, trieOK_placeVal (certified tries and
    their evaluation for every reordering and every moment oracle); profOK_nil, profOK_cons,
    profCert_perm, profCert_of_trie, profCert_of_step, profCert_of_step_chunks, trieProf_table_eq
    (certified profile lists and the tables they give); table_parts_merge, trieProf_table_parts
    (tables certified in parts and merged, in a tree).
  kernel_certified: >
    Table 3, piece (6, 3) (clsCount 44 6 3 = (6, 3, 35), shift g = 41/625): 77 trie nodes besides the
    root — 22 stored nodes (canonical states certified by StepCert from the parent, chunked with a
    linear merge when a step generates more than 900 entries) and 55 profile-only leaves — assembled
    in Tt_trie_ok : TrieOK and Tt_prof_ok : ProfOK (78 profiles with the root). Coverage: every
    multiset of blockMultisets 6 (22, up to 6 factors, degree 12) and of shortMultisets 2 (66, up to
    degree 40) has a certified profile (Tt_covers); both sets are sorted and prefix-closed
    (block6_shape, short2_shape); 139 partitions and 139 kept-part lists in B₂₁ (b21_counts).
    Tables: V2ℓ's degree-12 statement reproduced (genPieceP222_6_3_trie_same, := rfl); the 49-pair
    block |λ| ≤ 6 with weights cᵢcⱼ (231 keys, 4 parts); Σ_{i,j ≤ 10} J_T[P_2i, P_2j] (100 pairs, 901 keys,
    23 parts merged 23 → 6 → 2 → 1);
    J_T[P_20, P_20] piece (6, 3) (degree 40, 523 keys).
  exploratory: >
    specs/checks/sym_staged_v2l_counts.py and sym_trie_v2m_demo.py (Python, not theorems): 846
    generators, 17 381 ordered factor lists, 2 361 multisets, a 2 360-step trie per piece, longest 20
    factors; at piece (6, 3) the 150 three-factor nodes generate 1 309 843 entries (up to 9 878
    states), the block |λ| ≤ 8 447 116. The kernel count of all 2 361 multisets (b21Multisets) exceeds
    8 GB and is not part of the certified results.
  representation_note: "Tables are coefficient representations tableVal T Mo = Σ c · Mo s; V2m evaluates no rational moment pieceMn"
  unproved_assumptions: "none (axioms: propext, Quot.sound, Classical.choice)"
  outside_V2m: >
    The remaining 2 283 nodes of piece (6, 3) and the other pieces' tries, the moment values, the
    846 × 846 matrices, P⋆ and J_T(P⋆) − 4 I_T(P⋆) (Exploratory/V2m/SPEC.md §7).

