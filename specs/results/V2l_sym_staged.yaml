# Result record: twenty-fourth Challenge/Solution pair (V2ℓ, staged symmetric-function evaluation and reusable coefficient tables)

identity:
  id: V2ℓ
  statement: "Certified steps of V2k's evaluator — the list equality normalize (Lᵢ.flatMap (symStep n φᵢ)) = Lᵢ₊₁, or certified chunks of Lᵢ with one merge — compose to V2k's symRun and to V2i's placement value: ChainCert n φs [([], 1)] L → placeVal M n 0 Fin.elim0 Fin.elim0 φs = symFinal M L for every moment oracle (chainCert_placeVal; list-level symRun_of_steps). Chains for prefixes are reused by every continuation (chainCert_append). V2i's placement value depends only on the multiset of factors (placeVal_perm). Moment-coefficient tables are built from separately certified runs or moment profiles, each group (Q, m, n) evaluated once (stagedTable_eq, profTable_eq)."
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.4, the display of J_T (p. 41), §11 (B₂₁, p. 42)"
  builds_on: "V2k (symStep, normalize, symRun, symFinal, symPlaceVal_eq, msVal, placeVal_eq_msVal, genTable, tableVal, the example data, tab_PP_6_3, tv_PP_6_3, genPieceP22_6_3_expansion, demo_place_22/222/22222); V2j (MKey, WPair, the certified moments); V2i (placeVal, genPieceWith, genPiece, gpPP_6_3); A0–V2k unchanged"
  base_commits: "V2k 8ca723d on the V2j branch (8fa2aa5); the same Lean and Comparator content as V2k bbd5027 on main (V2j 4e02daf, main e20c364). V2k's independent verification is reported separately and is not assumed here"

state:
  mathematical: proved
  computational: kernel-verified demonstration
  provenance: pinned
  publication: draft

scope:
  proved: >
    stepCert_of_eq, stepCert_of_beq, stepCert_append, stepCert_merge, stepCert_chunks, stepCert_runs
    (step certificates from list equalities, Boolean checks, chunks and merges); chainCert_append,
    chainCert_snoc, chainCert_val, chainCert_placeVal, chainCert_symPlaceVal, chainCert_symRun,
    symRun_of_steps, placeVal_of_steps (chains compose to V2k's run and V2i's placement value;
    prefix reuse); mOp_comm, msVal_perm, placeVal_perm (the order of the factors is immaterial);
    stagedTable_eq, genPieceWith_eq_stagedTable, symFinal_abProfile, profCert_of_chain,
    profCert_of_chunks, profTable_eq, genPieceWith_eq_profTable, symFinal_flatten (tables from
    certified runs and moment profiles).
  demonstration: >
    Solution/SymStagedCert/ (52 modules, generated by specs/checks/sym_staged_v2l_demo.py): runs of
    P̂₂^k, k ≤ 6, on V2k's example data (Dm) and at Table 3, piece (6, 3) (T3), factors 1–4 in one file,
    factor 5 in 4 chunks and a merge, factor 6 in 12 chunks and a merge; chunk values and moment
    profiles of the degree-12 states. Solution/SymStagedDemo1–6.lean: StepsOK chain of P̂₂³ and prefix
    chain of P̂₂² (V2k's demo_place_222 and demo_place_22, := rfl); placeVal_perm with both orders
    evaluated; degree 10 (V2k's demo_place_22222, := rfl) and degree 12 on the example data; at
    Table 3, stagedTable reproduces V2k's tables of J_T[P₂, P₂] (V2i's gpPP_6_3, := rfl) and
    J_T[P_(2,2), P_(2,2)] (V2k's genPieceP22_6_3_expansion, := rfl); profTable gives piece (6, 3) of
    J_T[P_(2,2,2), P_(2,2,2)] (degree 12) as an explicit combination of 231 moments.
  unproved_assumptions: "none (axioms: propext, Quot.sound, Classical.choice)"
  outside_V2ℓ: >
    The 231 Table 3 moments of J_T[P_(2,2,2), P_(2,2,2)] on piece (6, 3) beyond V2j's certified ones,
    the other pieces, the 2 360-step prefix trie per piece for B₂₁, the 846 × 846 matrices, P⋆ and
    J_T(P⋆) − 4 I_T(P⋆) (Exploratory/V2l/SPEC.md §7).

