    (To_same_v2m_*, To_same_v2n_*); profile_10_8_8_direct; piece (6, 3) of J_T[P_10, P_(8,8)] (574
    moments). Literal factors To_f_q with bridges To_fe_q : stepFactor g q = To_f_q.
  exploratory: >
    specs/checks/sym_read_v2o_cost.py: minimal stored information for the three-factor layer
    (order-1 marks 38 253, binomial summary 128 800, minimum Σ min(|E|, d) = 30 495; 87.5 % of the
    21 024 groups have one exponent); leaf kernel work for all 150 leaves (marks route 885 781,
