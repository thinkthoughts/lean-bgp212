    Table 3, piece (6, 3) (clsCount 44 6 3 = (6, 3, 35), g = 41/625): all 66 three-factor multisets of
    B₂₁ of total degree ≤ 26 (of 150 three-factor multisets; three_counts, To_covers), each certified
    by one direct order-0 transition from its parent's marked profile of order ≤ 1, with no leaf state
