  representation_note: "Tables are coefficient representations tableVal T Mo = Σ c · Mo s; V2o evaluates no rational moment pieceMn"
  unproved_assumptions: "none (axioms: propext, Quot.sound, Classical.choice)"
  outside_V2o: >
    The other 84 three-factor nodes of piece (6, 3) (726 441 leaf entries by this route), the 2 120
    multisets with four or more factors not yet certified (157 of 2 361 have certified profiles with
    V2m, V2n and V2o), the other pieces, the moment values, the 846 × 846 matrices, P⋆ and
