# Result record: twenty-seventh Challenge/Solution pair (V2o, what one factor reads; one-level trie extensions)

identity:
  id: V2o
  statement: "For every factor φ of degree ≤ d, all class sizes, combinations and moment oracles, the child's moment profile is computed from the parent's moment profile and the binomial read summary δ_a(A, B, c) = Σ_{marks (c, e)} v (C(e + a, a) − 1), 1 ≤ a ≤ d (readStep_sufficient). The monomial factors x^a read exactly a! (n_c P(A, B) + δ_a(A, B, c)) (monomial_reads, monomial_reads_at), so over a field of characteristic 0 the summary is determined by the children under monomial factors of degree ≤ d (summary_determined): (P, δ₁, …, δ_d) is exactly the information read by factors of degree ≤ d. V2n's two states agree on every factor of degree ≤ 1 and differ under P̂₂ (summary_degree_gap)."
  source: "Source/bgp212.pdf: Table 3 (p. 39), §9.4, the display of J_T (p. 41), §11 (B₂₁, p. 42)"
  builds_on: "V2n (markProfile, markStep, markTerms, MarkOK, markProfile_step, markStep_val, markOK_of_tree, markOK_step_tree, profCert_of_markOK, markOK_congr, merge_slices_val, profOK_append, SymProfileProfData); V2m (TrieOK nodes and stored states, Tt_prof, Tt_prof_ok, trieProf_table_eq, shortMultisets, b21Kept_eq, natListMem); V2ℓ (ChainCert, StepCert, stepCert_runs, chainCert_snoc, ProfCert, abProfile, profTable); A0–V2n unchanged"
  base_commits: "V2n b5b1e20 on the V2j branch; the same Lean and Comparator content as V2n acab402 on v2n-main. V2n's independent verification is reported separately and is not assumed here"

state:
